# Serve o build estático do React e repassa /api e /uploads pra dentro
# da rede do Docker Compose até o container 'api' — o navegador nunca
# fala direto com a Api num host/porta separado, só com a própria
# origem do front (ver ARG VITE_API_URL no Dockerfile), o que faz este
# mesmo build funcionar em qualquer máquina/porta sem rebuildar.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router): qualquer caminho que não seja um arquivo real
    # do build cai no index.html, pra o próprio React decidir a tela —
    # sem isso, dar F5 numa rota como /clientes bateria direto no nginx
    # e voltaria 404 (o arquivo /clientes não existe no disco).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rotas de dado da Api (ver Barbearia.Api/Controladores/*) — 'api' é
    # o nome do serviço no docker-compose.yml, resolvido pela rede
    # interna do Compose (não é preciso saber IP nem porta publicada).
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos/logo enviadas por upload (ver
    # Barbearia.Infrastructure/Armazenamento/ArmazenamentoArquivosLocal.cs),
    # servidas pela própria Api como arquivo estático em /uploads/... —
    # mesmo raciocínio do bloco /api/ acima.
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
    }
}
